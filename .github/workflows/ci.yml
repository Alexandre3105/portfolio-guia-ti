name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mansk
          POSTGRES_PASSWORD: mansk
          POSTGRES_USER: mansk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mansk -d mansk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgres://mansk:mansk@127.0.0.1:5432/mansk
      NEXT_TELEMETRY_DISABLED: 1
      PAYLOAD_SECRET: ci-only-not-for-production
      SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22.17.0
          cache: true
          install: false

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run integration tests
        run: pnpm test:int

      - name: Run browser seam tests
        run: pnpm test:e2e

      - name: Build application
        run: pnpm build
